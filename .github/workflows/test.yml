name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  platforms:
    name: test (${{ matrix.os }})
    # Windows: where DevEco users work, and where the LSP client's drive-letter URIs, node.exe lookup and process
    # handling differ.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Without submodules: the bench is private, and the public checks must not need it.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: arkui-sem/package-lock.json
      # The call-site search uses ripgrep when it is on PATH; without it the tests cover the Node fallback only.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - if: runner.os == 'Windows'
        run: choco install ripgrep -y --no-progress
      - run: rg --version
      - run: npm ci
        working-directory: arkui-sem
      - run: npm run lint
        working-directory: arkui-sem
      - run: npm test
        working-directory: arkui-sem
        env:
          ARKUI_SEM_CONFIG: /nonexistent

  # The required check is named `test`; it passes only when every platform passed (a skipped job would count as passed).
  test:
    needs: platforms
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.platforms.result }}" = success
