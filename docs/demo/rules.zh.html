<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arkui-sem 规则</title>
<style>
  :root {
    --fg: #111; --mute: #6b6b6b; --faint: #a0a0a0; --line: #e3e3e3; --soft: #f6f6f6;
    --red: #c62828; --gate: #e06666; --agent: #2b5797; --redbg: #fdecec; --redhl: #f8c9c9; --fix: #1f6f78; --fixbg: #e6f3f4;
    --mono: ui-monospace, Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 2px 0 8px; }
  button { font: inherit; color: inherit; }
  pre { margin: 0; font: 12.5px/1.5 var(--mono); }
  .lead { color: var(--mute); margin: 0 0 14px; }

  /* Case tabs and rule line */
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px; cursor: pointer; color: var(--mute); }
  .tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--red); }
  .tabs b { font: 600 12px var(--mono); margin-left: 4px; }
  .rule { margin: 10px 0 2px; }
  .rule b { font: 600 13px var(--mono); color: var(--red); margin-right: 6px; }

  /* Loop strip: one button per stage; the current one shows its progress */
  .strip { list-style: none; margin: 4px 0 12px; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 0; }
  .strip li { display: flex; align-items: stretch; flex: 1 1 0; min-width: 118px; max-width: 220px; }
  .strip li + li::before { content: "\2192"; color: var(--faint); padding: 0 6px; align-self: center; font-size: 18px; }
  .strip button { position: relative; overflow: hidden; width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 4px; padding: 8px 10px 10px; cursor: pointer; text-align: left; line-height: 1.3; }
  /* Header bar coloured by actor, so agent and linter steps stand apart */
  .strip button { --actor: var(--mute); display: flex; flex-direction: column; justify-content: flex-start; }
  .strip .a-agent { --actor: var(--agent); }
  .strip .a-linter { --actor: var(--red); }
  .strip .a-gate { --actor: var(--gate); }
  .strip .a-user { --actor: var(--faint); }
  .strip small { display: block; margin: -8px -10px 6px; padding: 3px 10px; background: var(--actor); color: #fff; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .strip button:not(.done):not([aria-current]) small { opacity: .5; }
  .strip span { display: block; font-size: 15px; font-weight: 600; color: var(--mute); }
  .strip em { display: block; font-style: normal; font-size: 12.5px; color: var(--faint); margin-top: 2px; }
  .strip .done span, .strip .done em { color: var(--fg); }
  .strip [aria-current="step"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); background: var(--soft); }
  .strip [aria-current="step"] span, .strip [aria-current="step"] em { color: var(--fg); }
  .strip [aria-current="step"]::after { content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: var(--prog, 0%); background: var(--fg); }

  /* Player controls */
  .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; color: var(--mute); font-size: 13px; }
  .ctl button { border: 1px solid var(--line); background: #fff; border-radius: 3px; padding: 2px 10px; cursor: pointer; }
  #play, #restart { min-width: 2.6em; font-size: 15px; line-height: 1.4; }
  .ctl input { vertical-align: middle; width: 110px; }
  .ctl .view { margin-left: auto; }
  .static .anim-only { display: none; }

  /* Stage text: actor, title, note, quotes, report, judge */
  .grid { display: grid; grid-template-columns: minmax(300px, 5fr) 7fr; gap: 20px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .actor { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--mute); }
  .actor { font-weight: 600; }
  .actor.agent { color: var(--agent); }
  .actor.linter { color: var(--red); }
  .actor.gate { color: var(--gate); }
  .note { margin: 0 0 10px; }
  .q { margin: 8px 0; }
  .q > span { font-size: 12px; color: var(--mute); }
  .q pre, .report { white-space: pre-wrap; word-break: break-word; background: var(--soft); padding: 8px 10px; border-left: 2px solid var(--line); }
  .report { border-left-color: var(--red); }
  .part { display: block; border-radius: 2px; }
  .part.link { outline: none; text-decoration: underline dotted #b9b9b9; text-underline-offset: 3px; }
  .part.link.hl, .part.link:focus { background: var(--redhl); }
  .judge { font: 13px/1.6 var(--mono); border-left: 2px solid var(--red); padding: 6px 10px; background: var(--soft); }
  .judge div { display: grid; grid-template-columns: 9.5em 4em 1fr; }
  .judge .main { font-size: 15px; }
  .judge .main b { color: var(--red); font-size: 22px; line-height: 1.2; }
  .judge .grey { color: var(--faint); transition: opacity .4s; }
  .judge .off { opacity: 0; }
  .judge p { margin: 6px 0 0; font: 12px/1.4 system-ui, sans-serif; color: var(--faint); }
  .judge ul { margin: 4px 0 2px; padding-left: 18px; font: 13.5px/1.5 system-ui, sans-serif; }

  /* Phone on the "On screen" and "Re-check" stages: the page's build(), drawn with ArkUI-like controls */
  .phone { width: 190px; margin: 6px 0 12px; padding: 8px; border-radius: 26px; background: #222; }
  .phone .scr { position: relative; height: 270px; border-radius: 18px; background: #fff; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 34px 8px 10px; overflow: hidden; font-size: 14px; }
  .phone .scr::before { content: ""; position: absolute; top: 9px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #222; }
  .phone .t { min-height: 1.5em; padding: 0 4px; border-radius: 3px; }
  .phone .t:empty { width: 6em; border-bottom: 1px dashed var(--faint); }
  .phone .t.flash { background: var(--fixbg); }
  .phone .row { display: flex; align-items: center; gap: 12px; }
  .phone .b { border-radius: 999px; background: #007dff; color: #fff; font-size: 13px; padding: 4px 16px; transition: transform .1s, filter .1s; }
  .phone .b.press { transform: scale(.94); filter: brightness(.75); }
  .phone .sw { width: 36px; height: 20px; border-radius: 10px; background: #ccc; position: relative; }
  .phone .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
  .phone .dot { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: rgba(17, 17, 17, .18); border: 2px solid rgba(17, 17, 17, .45); pointer-events: none; }

  /* Code panel */
  #codes { position: relative; max-height: 70vh; overflow: auto; }
  .file { font: 12px var(--mono); color: var(--mute); padding: 4px 8px; border: 1px solid var(--line); border-bottom: 0; background: var(--soft); }
  .code { border: 1px solid var(--line); overflow-x: auto; margin-bottom: 14px; padding: 4px 0; font: 12.5px/1.6 var(--mono); }
  .ln { display: flex; white-space: pre; min-width: max-content; border-left: 3px solid transparent; }
  .ln i { font-style: normal; color: #aaa; width: 3.2em; text-align: right; padding-right: 6px; user-select: none; flex: none; }
  .ln u { text-decoration: none; width: 1.2em; color: var(--mute); flex: none; user-select: none; }
  .ln.gap { color: var(--faint); }
  .ln.add { background: var(--soft); border-left-color: #888; }
  .ln.bug, .ln.ref { background: var(--redbg); border-left-color: var(--red); }
  .ln.hl { background: var(--redhl); }
  .ln.fadd { background: var(--fixbg); border-left-color: var(--fix); }
  .ln.fdel { color: #8a8a8a; text-decoration: line-through; border-left-color: #b5cfd2; }
  .ln.fdel span { color: inherit; }
  .ln .cur { border-right: 2px solid var(--fg); }
  .k { color: #7b2fa0; } .d { color: #a65e00; } .s { color: #2e7d32; } .c { color: #999; } .n { color: #1565c0; }

  /* Static view: every stage of the case, stacked */
  .stage-block { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
</style>
</head>
<body>
<main id="app">
  <h1>arkui-sem：每条规则如何发现 ArkUI 状态缺陷</h1>
  <p class="lead">四段录制的编程智能体会话，每条规则一段。</p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <p class="rule" id="rule"></p>
  <ol class="strip anim-only" id="strip" aria-label="智能体循环"></ol>
  <div class="ctl">
    <span class="anim-only"><button id="play" aria-label="暂停" title="暂停">&#x275A;&#x275A;</button> <button id="restart" aria-label="从头开始" title="从头开始">&#x23EE;&#xFE0E;</button></span>
    <label class="anim-only">速度 <input type="range" id="speed" min="0.5" max="3" step="0.25" value="1"> <output id="spv">1&times;</output></label>
    <span class="anim-only" id="pos"></span>
    <button class="view" id="view">全部步骤</button>
  </div>
  <div class="grid anim-only">
    <section aria-live="polite">
      <div id="story"></div>
    </section>
    <section id="codes"></section>
  </div>
  <div id="all"></div>
</main>

  city: string = ''
}

class User {
  name: string = ''
  address: Address = new Address()
}

@Observed
class Settings {
  dark: boolean = false
}

struct Profile {
  @State user: User = new User()
  @State settings: Settings = new Settings()

  build() {
    Column() {

        this.user.address.city = 'Shenzhen'
      })
      Button('Theme').onClick(() => {
        this.settings.dark = !this.settings.dark
      })
    }
  }
}

<script type="text/plain" data-run="clock" data-key="file" data-file="Clock.ets">
import { emitter } from '@kit.BasicServicesKit'

@Entry
@Component
struct Clock {
  @State now: string = new Date().toLocaleTimeString()
  @State zone: string = 'UTC'

  aboutToAppear(): void {
    emitter.on('zoneChanged', (event: emitter.EventData) => {
      this.zone = `${event.data?.zone}`
    })
  }

  build() {
    Column() {
      Text(this.now)
      Text(this.zone)
    }
  }
}
</script>

<script type="text/plain" data-run="clock" data-key="e0.new" data-file="Clock.ets">
  @State now: string = new Date().toLocaleTimeString()
  @State zone: string = 'UTC'
  private timer: number = -1

  aboutToAppear(): void {
    this.timer = setInterval(() => {
      this.now = new Date().toLocaleTimeString()
    }, 1000)
    emitter.on('zoneChanged', (event: emitter.EventData) => {
      this.zone = `${event.data?.zone}`
    })
  }

  aboutToDisappear(): void {
    clearInterval(this.timer)
  }
</script>

  edit:   { actor: 'agent',  label: '编辑',      title: '智能体的编辑',                   view: 'edit',  ms: null },
  screen: { actor: 'app',    label: '屏幕上', title: '哪里出了问题',                         view: 'after', ms: 5000 },
  judge:  { actor: 'linter', label: '评判',     title: 'Linter 为候选问题打分',         view: 'after', ms: null },
  report: { actor: 'linter', label: '报告',    title: '报告，附加在编辑结果之后', view: 'after', ms: null },

const ACTOR = { user: '用户', agent: '智能体', app: '屏幕上', linter: 'Linter', gate: '空闲门控' };

// ---------------------------------------------------------------------------------------------------------------
// 4. Code versions and line diff
// ---------------------------------------------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
const clamp = (x) => Math.max(0, Math.min(1, x));

function applyEdits(files, edits) {
  const out = { ...files };
  for (const e of edits) out[e.file] = out[e.file].replace(e.old, () => e.new);
  return out;
}

// base: before the agent; after: after its first edit (what the report saw); fixed: after the fix edit.
function versions(c) {
  const r = RUNS[c.id];
  const after = applyEdits(r.files, [r.edits[0]]);
  const fixEdit = r.edits[c.stages.find((s) => s.kind === 'fix').edit];
  return { base: r.files, after, fixed: applyEdits(after, [fixEdit]) };
}

// Line diff by longest common subsequence. Rows: [op, text, line number in b], op is ' ', '+' or '-'.
function diff(a, b) {
  a = a.split('\n');
  b = b.split('\n');
  const n = a.length, m = b.length, lcs = [];
  for (let i = n; i >= 0; i--) {
    lcs[i] = [];
    for (let j = m; j >= 0; j--) {
      if (i === n || j === m) lcs[i][j] = 0;
      else if (a[i] === b[j]) lcs[i][j] = lcs[i + 1][j + 1] + 1;
      else lcs[i][j] = Math.max(lcs[i + 1][j], lcs[i][j + 1]);
    }
  }
  const rows = [];
  let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { rows.push([' ', b[j], ++j]); i++; }
    else if (i < n && (j === m || lcs[i + 1][j] >= lcs[i][j + 1])) rows.push(['-', a[i++], 0]);
    else rows.push(['+', b[j], ++j]);
  }
  return rows;
}

// ---------------------------------------------------------------------------------------------------------------
// 5. Rendering: code panel, report, judge, stage text
// ---------------------------------------------------------------------------------------------------------------
const KEYWORDS = 'import|from|export|struct|class|build|this|new|const|private|void|number|string|boolean|true|false';
const TOKENS = new RegExp(`(\\/\\/.*$)|('[^']*'|\`[^\`]*\`)|(@\\w+)|\\b(${KEYWORDS})\\b|\\b(\\d+)\\b`, 'g');
function hilite(s) {
  return esc(s).replace(TOKENS, (m, comment, str, deco, kw) =>
    `<span class="${comment ? 'c' : str ? 's' : deco ? 'd' : kw ? 'k' : 'n'}">${m}</span>`);
}

// Rows of one file for a code version, with each row's CSS class and whether it is typed in by the animation.
function codeRows(v, f, view) {
  const rows = view === 'base' ? diff(v.base[f], v.base[f])
    : view === 'fix' || view === 'fixed' ? diff(v.after[f], v.fixed[f])
    : diff(v.base[f], v.after[f]);
  const out = [];
  for (const [op, text, n] of rows) {
    if (op === '-' && view !== 'fix') continue;
    let cls = '';
    if (op === '-') cls = 'fdel';
    else if (op === '+') cls = { edit: 'add', fix: 'fadd', fixed: 'fadd' }[view] || '';
    const marker = op === ' ' || view === 'after' || view === 'fixed' ? '' : op;
    out.push({ op, text, n, cls, marker, key: op === '-' ? '' : `${f}:${n}`, typed: op === '+' && (view === 'edit' || view === 'fix') });
  }
  return out;
}

// Code panel HTML. lines: { bug, ref } sets of "File.ets:n". excerpt: keep only rows near changed or marked lines
// (static view). Typed rows get data-ty.
function codeHtml(c, view, lines, excerpt) {
  const v = versions(c), typed = [];
  let html = '';
  for (const f of Object.keys(v.base)) {
    let rows = codeRows(v, f, view);
    rows.forEach((r) => { r.cls += lines.bug.has(r.key) ? ' bug' : lines.ref.has(r.key) ? ' ref' : ''; });
    if (excerpt) {
      const near = (i) => rows.slice(Math.max(0, i - 3), i + 4).some((r) => r.op !== ' ' && view !== 'after' || /bug|ref/.test(r.cls));
      const keep = rows.map((_, i) => near(i));
      keep.forEach((k, i) => { if (!k && keep[i - 1] && near(i + 1)) keep[i] = true; }); // a one-line gap saves nothing
      if (!keep.some(Boolean)) continue;
      rows = rows.flatMap((r, i) => keep[i] ? [r] : keep[i - 1] ? [{ gap: true }] : []);
    }
    html += `<div class="file">${f}</div><div class="code">`;
    for (const r of rows) {
      if (r.gap) { html += '<div class="ln gap"><i>⋮</i><u></u><span></span></div>'; continue; }
      const ty = r.typed && !excerpt ? ` data-ty="${typed.push(r.text) - 1}"` : '';
      html += `<div class="ln ${r.cls}" data-k="${r.key}"${ty}><i>${r.n || ''}</i><u>${r.marker}</u><span>${hilite(r.text) || ' '}</span></div>`;
    }
    html += '</div>';
  }
  return { html, typed };
}

// A report line maps to a part by its prefix: "- [" is the finding head, then why / at / fix.
function reportHtml(text, links) {
  const lines = text.split('\n').map((line) => {
    const m = line.match(/^\s+(why|at|fix):/);
    const keys = links[line.startsWith('- [') ? 'head' : m && m[1]];
    return keys
      ? `<span class="part link" tabindex="0" data-ks="${keys.join(' ')}">${esc(line)}</span>`
      : `<span class="part">${esc(line) || ' '}</span>`;
  });
  return `<pre class="report">${lines.join('')}</pre>`;
}

function judgeHtml(c, final) {
  const grey = GREY[c.id].map(([backend, p, band]) =>
    `<div class="grey ${final ? '' : 'off'}"><span>${backend}</span><span>${p}</span><span>${band}</span></div>`).join('');
  const foot = '多个评判模型对同一段代码打了分。';
  return `<div class="judge"><div class="main"><span>Clef</span><b class="pnum">${final ? c.p : '0.00'}</b><span>发现</span></div>${grey}<p>${foot}</p></div>`;
}

// A rule decided from code facts alone: no model, so no score; list the facts instead.
function factsHtml(facts) {
  return `<div class="judge"><div class="main"><span>模型</span><b>无</b><span>仅凭事实</span></div><ul>${facts.map((f) => `<li>${esc(f)}</li>`).join('')}</ul></div>`;
}

const QUOTE_LABEL = { t: '智能体', c: 'Linter 复查（arkui_check）' };
function quoteHtml(r, key, st) {
  const text = key === 'fixOut' ? r.fixOut : key[0] === 't' ? r.texts[+key.slice(1)] : r.checks[+key.slice(1)];
  const label = key === 'fixOut' ? st.quoteLabel : QUOTE_LABEL[key[0]];
  return `<div class="q"><span>${esc(label)}</span><pre>${esc(text)}</pre></div>`;
}

// The text column of one stage. final: show the end state (static view, or after a manual step).
function stageHtml(c, st, final) {
  const r = RUNS[c.id], kind = KINDS[st.kind];
  let h = `<span class="actor ${kind.actor}">${ACTOR[kind.actor]}</span><h2>${esc(st.title || kind.title)}</h2>`;
  if (st.note) h += `<p class="note">${esc(st.note)}</p>`;
  if (st.kind === 'task') h += `<div class="q"><span>提示词</span><pre>${esc(r.prompt)}</pre></div>`;
  if (st.kind === 'judge' && st.facts) h += factsHtml(st.facts);
  else if (st.kind === 'judge') h += `<p class="note">Linter 在代码中找到候选问题，并让一个 System One 模型判断它是真实缺陷的可能性。</p>${judgeHtml(c, final)}`;
  if (st.kind === 'report') h += reportHtml(r.report, c.links);
  if (st.kind === 'gate') h += `<div class="q"><span>由空闲门控作为新消息发送</span>${reportHtml(r.gate, c.links)}</div>`;
  for (const key of st.quotes || []) h += quoteHtml(r, key, st);
  const mode = phoneMode(c, st);
  if (mode) h += phoneHtml(PHONES[c.id], final ? phoneEnd(PHONES[c.id], mode) : PHONES[c.id].init);
  return h;
}

// Lines a stage points at: bug, the lines "On screen" blames; ref, the lines the judge or the report cites.
function stageLines(c, st) {
  const cited = st.kind === 'judge' ? st.refs || c.links.head
    : st.kind === 'report' || st.kind === 'gate' ? Object.values(c.links).flat() : [];
  return { bug: new Set(st.marks), ref: new Set(cited) };
}

// ---------------------------------------------------------------------------------------------------------------
// 6. Animations. Each returns { dur, update(elapsedMs) }; update must also accept Infinity (stage complete).
// ---------------------------------------------------------------------------------------------------------------

// Types the '+' lines in order; lines not reached yet are hidden.
function typer(typed) {
  const total = typed.reduce((a, s) => a + s.length + 1, 0);
  const typingMs = Math.min(2600, 16 * total);
  const els = [...document.querySelectorAll('#codes [data-ty]')];
  const shown = els.map(() => -1);
  return {
    dur: 300 + typingMs + 1400,
    update(e) {
      let left = total * clamp((e - 300) / typingMs);
      els.forEach((el, i) => {
        const s = typed[i];
        const k = Math.max(0, Math.min(s.length + 1, Math.floor(left)));
        left -= s.length + 1;
        if (k === shown[i]) return;
        shown[i] = k;
        el.style.display = k === 0 ? 'none' : '';
        el.lastChild.innerHTML = k > s.length ? hilite(s) || ' ' : `<span class="cur">${esc(s.slice(0, k))}</span>`;
      });
    },
  };
}

// Reveals report lines one by one; each linked part marks its code lines as it appears and is lit briefly.
function revealer(perLineMs) {
  const parts = [...document.querySelectorAll('#story .report .part')];
  const end = 300 + parts.length * perLineMs;
  let shown = -1;
  return {
    dur: end + 1800,
    update(e) {
      const n = Math.min(parts.length, Math.floor((e - 300) / perLineMs) + 1);
      if (n === shown) return;
      shown = n;
      parts.forEach((p, i) => { p.style.visibility = i < n ? '' : 'hidden'; });
      const lit = parts.slice(0, n).filter((p) => p.dataset.ks).flatMap((p) => p.dataset.ks.split(' '));
      document.querySelectorAll('#codes .ln').forEach((el) => el.classList.toggle('ref', lit.includes(el.dataset.k)));
      const current = e < end + 600 ? parts[n - 1] : null;
      const keys = current && current.dataset.ks ? current.dataset.ks.split(' ') : [];
      light(keys, keys.length > 0);
    },
  };
}

// Counts Clef's p up from 0, then fades in the grey backends.
function counter(c) {
  const p = +c.p;
  return {
    dur: 3600,
    update(e) {
      document.querySelector('#story .pnum').textContent = (p * (1 - (1 - clamp(e / 1300)) ** 3)).toFixed(2);
      document.querySelectorAll('#story .judge .grey').forEach((g) => g.classList.toggle('off', e < 1600));
    },
  };
}

// Plays the taps on the phone: a touch dot on the button, a press, then the state change (if any) flashes.
function tapper(p, mode, minMs) {
  const LEAD = 500, TAP = 1300, PRESS = 300, APPLY = 450, FLASH = 800, DOT = 900;
  const taps = p[mode], scr = document.querySelector('#story .phone .scr');
  let shown = '';
  return {
    dur: Math.max(minMs, LEAD + taps.length * TAP + 1000),
    update(e) {
      const i = e < LEAD ? -1 : Math.floor((e - LEAD) / TAP), k = e - LEAD - i * TAP;
      const s = { ...p.init };
      let flash = [];
      taps.forEach(([, set], j) => {
        if (!set || j > i || (j === i && k < APPLY)) return;
        Object.assign(s, set);
        if (j === i && k < APPLY + FLASH) flash = Object.keys(set);
      });
      const active = i >= 0 && i < taps.length && k < DOT ? taps[i][0] : null;
      const press = active !== null && k >= PRESS && k < APPLY + 100;
      const key = JSON.stringify([s, active, press, flash]);
      if (key === shown) return;
      shown = key;
      scr.innerHTML = p.ui(s);
      scr.querySelectorAll('.t').forEach((el) => el.classList.toggle('flash', flash.includes(el.dataset.f)));
      const b = active !== null && scr.querySelector(`[data-b="${active}"]`);
      if (!b) return;
      b.classList.toggle('press', press);
      scr.insertAdjacentHTML('beforeend', `<span class="dot" style="left:${b.offsetLeft + b.offsetWidth / 2}px;top:${b.offsetTop + b.offsetHeight / 2}px"></span>`);
    },
  };
}

function stageAnimation(c, st, typed) {
  const mode = phoneMode(c, st);
  if (mode) return tapper(PHONES[c.id], mode, KINDS[st.kind].ms);
  if (st.kind === 'edit' || st.kind === 'fix') return typer(typed);
  if (st.kind === 'judge') return st.facts ? { dur: 3600, update() {} } : counter(c);
  if (st.kind === 'report') return revealer(900);
  if (st.kind === 'gate') return revealer(450);
  return { dur: KINDS[st.kind].ms, update() {} };
}

// ---------------------------------------------------------------------------------------------------------------
// 7. Player: current case and stage, the clock, controls and keyboard
// ---------------------------------------------------------------------------------------------------------------
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const player = { ci: 0, si: 0, t: 0, playing: !reducedMotion, speed: 1, anim: { dur: 1, update() {} }, staticView: reducedMotion };

function renderHeader() {
  const c = CASES[player.ci];
  $('tabs').innerHTML = CASES.map((x, i) =>
    `<button role="tab" aria-selected="${i === player.ci}" data-c="${i}">${x.name}<b>${x.tag}</b></button>`).join('');
  $('rule').innerHTML = `<b>${c.rule}</b>${esc(c.plain)}`;
  $('view').textContent = player.staticView ? '动画' : '全部步骤';
  $('app').classList.toggle('static', player.staticView);
}

function renderStage() {
  const c = CASES[player.ci], st = c.stages[player.si], kind = KINDS[st.kind];
  $('strip').innerHTML = c.stages.map((x, i) => {
    const k = KINDS[x.kind];
    const current = i === player.si ? 'aria-current="step"' : '';
    return `<li><button data-s="${i}" class="a-${k.actor} ${i < player.si ? 'done' : ''}" ${current}><small>${ACTOR[k.actor]}</small><span>${x.label || k.label}</span><em>${esc(x.cap)}</em></button></li>`;
  }).join('');
  $('story').innerHTML = stageHtml(c, st, false);
  const { html, typed } = codeHtml(c, kind.view, stageLines(c, st), false);
  $('codes').innerHTML = html;
  player.anim = stageAnimation(c, st, typed);
  scrollCodeToStage(c, st); // before update(): typed lines are hidden at t = 0 and have no position
  player.anim.update(player.t);
  $('pos').textContent = `第 ${player.si + 1} / ${c.stages.length} 步`;
  setPlayButton(player.playing ? 'pause' : 'play');
}

// Scrolls the code panel so the first line this stage is about sits in its upper third.
function scrollCodeToStage(c, st) {
  const box = $('codes');
  const el = box.querySelector('[data-ty], .ln.bug, .ln.ref, .ln.fadd')
    || (st.kind === 'task' ? null : box.querySelector(`[data-k="${c.links.head[0]}"]`));
  box.scrollTop = el ? el.offsetTop - box.clientHeight / 3 : 0;
}

function render() {
  renderHeader();
  if (player.staticView) renderStatic(); else { $('all').innerHTML = ''; renderStage(); }
}

// The play button shows what a press does: pause, play, or replay the case from the start.
const PLAY_BUTTON = { pause: ['❚❚', '暂停'], play: ['▶︎', '播放'], replay: ['↻', '重播'] };
function setPlayButton(state) {
  const [symbol, name] = PLAY_BUTTON[state], b = $('play');
  Object.assign(b, { textContent: symbol, title: name });
  b.dataset.state = state;
  b.setAttribute('aria-label', name);
}

// Manual moves show the stage complete and pause.
function goTo(si) {
  player.playing = false;
  player.si = Math.max(0, Math.min(CASES[player.ci].stages.length - 1, si));
  player.t = Infinity;
  render();
}
function restart() { Object.assign(player, { si: 0, t: 0, playing: true }); render(); }
function togglePlay() {
  const atEnd = player.t >= player.anim.dur;
  if (!player.playing && atEnd) { // a stage shown complete (manual step) plays again from its start
    Object.assign(player, { t: 0, playing: true });
    return render();
  }
  player.playing = !player.playing;
  setPlayButton(player.playing ? 'pause' : 'play');
}

let lastFrame = performance.now();
function frame(now) {
  const dt = now - lastFrame;
  lastFrame = now;
  if (player.playing && !player.staticView) {
    player.t += dt * player.speed;
    player.anim.update(player.t);
    if (player.t >= player.anim.dur) {
      if (player.si < CASES[player.ci].stages.length - 1) { player.si++; player.t = 0; render(); }
      else { player.playing = false; setPlayButton('replay'); }
    }
  }
  const current = document.querySelector('.strip [aria-current]');
  if (current) current.style.setProperty('--prog', `${100 * clamp(player.t / player.anim.dur)}%`);
  requestAnimationFrame(frame);
}

// Highlights code lines and the report parts that point at them, within one stage (root).
function light(keys, on, root = document) {
  const set = new Set(keys);
  root.querySelectorAll('.ln').forEach((el) => el.classList.toggle('hl', on && set.has(el.dataset.k)));
  root.querySelectorAll('.part.link').forEach((el) =>
    el.classList.toggle('hl', on && el.dataset.ks.split(' ').some((k) => set.has(k))));
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.c) { player.ci = +b.dataset.c; restart(); }
  else if (b.dataset.s) goTo(+b.dataset.s);
  else if (b.id === 'play') { if (b.dataset.state === 'replay') restart(); else togglePlay(); }
  else if (b.id === 'restart') restart();
  else if (b.id === 'view') { player.staticView = !player.staticView; player.playing = false; player.t = Infinity; render(); }
});
$('speed').addEventListener('input', (e) => {
  player.speed = +e.target.value;
  $('spv').textContent = `${player.speed}×`;
});
document.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey || e.target.tagName === 'INPUT' || player.staticView) return;
  if (e.key === 'ArrowRight') goTo(player.si + 1);
  else if (e.key === 'ArrowLeft') goTo(player.si - 1);
  else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); togglePlay(); }
});
for (const type of ['mouseover', 'focusin']) {
  document.addEventListener(type, (e) => {
    const part = e.target.closest && e.target.closest('.part.link');
    const line = e.target.closest && e.target.closest('.ln.ref');
    const root = (part || line)?.closest('.stage-block') || document;
    if (part) light(part.dataset.ks.split(' '), true, root);
    else if (line) light([line.dataset.k], true, root);
    else if (type === 'mouseover') light([], false);
  });
}
document.addEventListener('focusout', () => light([], false));

// ---------------------------------------------------------------------------------------------------------------
// 8. Static view: every stage of the case stacked, end states, code cut to the lines each stage is about
// ---------------------------------------------------------------------------------------------------------------
function renderStatic() {
  const c = CASES[player.ci];
  $('all').innerHTML = c.stages.map((st, i) => {
    const kind = KINDS[st.kind];
    const showCode = ['edit', 'screen', 'report', 'fix'].includes(st.kind);
    const code = showCode ? codeHtml(c, kind.view, stageLines(c, st), true).html : '';
    return `<section class="stage-block"><div class="grid"><div><span class="actor">${i + 1} / ${c.stages.length} · ${esc(st.cap)}</span> ${stageHtml(c, st, true)}</div><div>${code}</div></div></section>`;
  }).join('');
}

render();
requestAnimationFrame(frame);
</script>
</body>
</html>
